# Shelly 1PM Mini Gen4 on Zigbee. Pins and calibration from automatous-io/shelly-gen4-esphome.

substitutions:
  device_name: "shelly-1pm-mini-gen4-zb"
  friendly_name: "Shelly 1PM Mini Gen4 ZB"
  zigbee_model: "Shelly 1PM Mini Gen4 (ESPHome)"
  pin_relay: GPIO10
  pin_switch: GPIO12
  pin_button: GPIO22
  pin_led: GPIO5
  pin_bl0942_tx: GPIO20
  pin_bl0942_rx: GPIO19
  pin_ntc: GPIO4
  voltage_reference: "14553.25051"
  current_reference: "255278.38517"
  max_power: "1920"
  max_current: "8"

packages:
  base: !include common/zigbee-base.yaml
  relay: !include common/relay.yaml
  meter: !include common/meter-bl0942.yaml
  temp: !include common/temp-ntc.yaml
  protect_temp: !include common/protect-temp.yaml
  protect_meter: !include common/protect-meter.yaml

# stock firmware leaves pad hold on the relay and LED pins
esphome:
  on_boot:
    priority: 1000
    then:
      - lambda: |-
          gpio_hold_dis(GPIO_NUM_10);
          gpio_hold_dis(GPIO_NUM_5);
