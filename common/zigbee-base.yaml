# Shared core for Shelly Gen4 (ESP32-C6) on Zigbee: router, no Wi-Fi, UART updates only.

# defaults; model files override any of these
substitutions:
  relay_restore: "RESTORE_DEFAULT_OFF"
  input_debounce: "50ms"
  factory_reset_hold: "5s"
  line_frequency: "50Hz"
  power_update_interval: "10s"
  ntc_b_constant: "3350"
  max_voltage: "280"
  max_temperature: "95"
  # reboot when the coordinator has not answered for this many seconds
  zigbee_watchdog_timeout: "900"
  # sensors report on a meaningful change, and at least this often
  report_heartbeat: "300s"
  report_delta_voltage: "1"
  report_delta_current: "0.05"
  report_delta_power: "2"
  report_delta_energy: "0.01"
  report_delta_temperature: "1"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32-c6-devkitm-1
  flash_size: 8MB
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: UART0

zigbee:
  id: zb
  router: true
  power_source: MAINS_SINGLE_PHASE
  model: ${zigbee_model}

status_led:
  pin:
    number: ${pin_led}
    inverted: true

# Zigbee watchdog: once a minute, ask the coordinator for its node descriptor. The coordinator's
# Zigbee stack answers this itself, so it works while Zigbee2MQTT or ZHA is restarting. If no
# answer arrives for zigbee_watchdog_timeout seconds after the device has joined, reboot: the
# relays restore their state, and the Zigbee stack starts fresh. Never armed before the first join,
# so pairing is not affected.
interval:
  - interval: 60s
    then:
      - lambda: |-
          static std::atomic<uint32_t> last_ok{0};
          static bool armed = false;
          const uint32_t now = millis();
          const uint32_t timeout_ms = ${zigbee_watchdog_timeout} * 1000UL;
          if (id(zb).is_joined() && !armed) {
            armed = true;
            last_ok = now;
          }
          if (!armed) return;
          if (now - last_ok.load() > timeout_ms) {
            ESP_LOGE("zigbee.watchdog", "No answer from the coordinator for %us, rebooting",
                     (unsigned) ((now - last_ok.load()) / 1000));
            App.safe_reboot();
            return;
          }
          if (!id(zb).is_joined() || !esp_zigbee_lock_acquire(10 / portTICK_PERIOD_MS)) return;
          ezb_zdo_node_desc_req_t req = {};
          req.dst_nwk_addr = 0x0000;
          req.field.nwk_addr_of_interest = 0x0000;
          req.cb = [](const ezb_zdo_node_desc_req_result_t *result, void *) {
            if (result->error == EZB_ERR_NONE && result->rsp != nullptr &&
                result->rsp->status == EZB_ZDP_STATUS_SUCCESS) {
              last_ok = millis();
            }
          };
          ezb_zdo_node_desc_req(&req);
          esp_zigbee_lock_release();
