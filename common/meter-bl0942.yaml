# BL0942 power meter on UART1 (the logger owns UART0). 9600 baud, not the chip's 4800 default.

uart:
  id: uart_bl0942
  tx_pin: ${pin_bl0942_tx}
  rx_pin:
    number: ${pin_bl0942_rx}
    mode:
      input: true
      pullup: true
  baud_rate: 9600
  stop_bits: 1

sensor:
  - platform: bl0942
    uart_id: uart_bl0942
    line_frequency: ${line_frequency}
    update_interval: ${power_update_interval}
    voltage_reference: ${voltage_reference}
    current_reference: ${current_reference}
    voltage:
      id: sensor_voltage
    current:
      id: sensor_current
      accuracy_decimals: 3
    power:
      id: sensor_power
    frequency:
      id: sensor_frequency
    energy:
      id: sensor_energy
      device_class: energy
      state_class: total_increasing
      accuracy_decimals: 3

  # Zigbee reports: copies of the meter readings, sent on a meaningful change or every
  # report_heartbeat. The protections still see every raw reading.
  - platform: copy
    source_id: sensor_voltage
    name: "Voltage"
    report: force
    unit_of_measurement: V
    device_class: voltage
    accuracy_decimals: 1
    filters:
      - or:
          - throttle: ${report_heartbeat}
          - delta: ${report_delta_voltage}

  - platform: copy
    source_id: sensor_current
    name: "Current"
    report: force
    unit_of_measurement: A
    device_class: current
    accuracy_decimals: 3
    filters:
      - or:
          - throttle: ${report_heartbeat}
          - delta: ${report_delta_current}

  - platform: copy
    source_id: sensor_power
    name: "Power"
    report: force
    unit_of_measurement: W
    device_class: power
    accuracy_decimals: 1
    filters:
      - or:
          - throttle: ${report_heartbeat}
          - delta: ${report_delta_power}

  - platform: copy
    source_id: sensor_energy
    name: "Energy"
    report: force
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - or:
          - throttle: ${report_heartbeat}
          - delta: ${report_delta_energy}
